name: tests

on:
  push:
  pull_request:

jobs:
  public-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.12.1 torchvision==0.27.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[all,test]"
      - name: Test
        env:
          MPLBACKEND: Agg
        run: pytest
      - name: Quick Start
        env:
          MPLBACKEND: Agg
        run: python examples/quick_start/run_quick_start.py
      - name: Figure gallery
        env:
          MPLBACKEND: Agg
        run: python examples/figure_gallery/run_all_figures.py
